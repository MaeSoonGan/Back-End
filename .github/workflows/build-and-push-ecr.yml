name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/api/**"
      - "apps/realtime/**"
      - "apps/worker/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - ".github/workflows/build-and-push-ecr.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build. Use all to build every service."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - admin-service
          - auth-service
          - contest-service
          - market-service
          - order-service
          - market-realtime-service
          - user-realtime-service
          - trade-sync-worker
          - notification-api

concurrency:
  group: build-and-push-ecr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - contest-service
          - market-service
          - order-service
          - market-realtime-service
          - user-realtime-service
          - trade-sync-worker
          - notification-api

    steps:
      - name: Skip unselected service
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.service != 'all' && inputs.service != matrix.service }}
        run: echo "Skipping ${{ matrix.service }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        run: |
          if [[ "${{ matrix.service }}" == "trade-sync-worker" ]]; then
            SERVICE_PATH="apps/worker/${{ matrix.service }}"
          elif [[ "${{ matrix.service }}" == *"realtime-service" ]]; then
            SERVICE_PATH="apps/realtime/${{ matrix.service }}"
          else
            SERVICE_PATH="apps/api/${{ matrix.service }}"
          fi

          docker build \
            -f $SERVICE_PATH/Dockerfile \
            -t $ECR_REGISTRY/maesoongan/${{ matrix.service }}:${{ github.sha }} \
            -t $ECR_REGISTRY/maesoongan/${{ matrix.service }}:latest \
            .

      - name: Push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        run: |
          docker push $ECR_REGISTRY/maesoongan/${{ matrix.service }}:${{ github.sha }}
          docker push $ECR_REGISTRY/maesoongan/${{ matrix.service }}:latest

  update-k8s-image-tags:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update Kubernetes image tags
        env:
          SELECTED_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.service || 'all' }}
        run: |
          set -euo pipefail

          all_services=(
            admin-service
            auth-service
            contest-service
            market-service
            order-service
            market-realtime-service
            user-realtime-service
            trade-sync-worker
            notification-api
          )

          if [[ "$SELECTED_SERVICE" == "all" ]]; then
            services=("${all_services[@]}")
          else
            services=("$SELECTED_SERVICE")
          fi

          for service in "${services[@]}"; do
            if [[ "$service" == "trade-sync-worker" ]]; then
              manifest="infra/k8s/worker/${service}.yaml"
            elif [[ "$service" == *"realtime-service" ]]; then
              manifest="infra/k8s/realtime/${service}.yaml"
            else
              manifest="infra/k8s/api/${service}.yaml"
            fi

            image="$ECR_REGISTRY/maesoongan/${service}:${GITHUB_SHA}"
            sed -i -E "s#image: ${ECR_REGISTRY}/maesoongan/${service}:[^[:space:]]+#image: ${image}#" "$manifest"
            echo "Updated $manifest -> $image"
          done

      - name: Commit Kubernetes image tag updates
        run: |
          set -euo pipefail

          if git diff --quiet -- infra/k8s/api infra/k8s/realtime infra/k8s/worker; then
            echo "No Kubernetes image tag changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add infra/k8s/api infra/k8s/realtime infra/k8s/worker
          git commit -m "CHORE: update Kubernetes image tags to ${GITHUB_SHA}"
          git push origin HEAD:${GITHUB_REF_NAME}
