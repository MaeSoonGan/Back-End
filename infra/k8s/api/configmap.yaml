apiVersion: v1
kind: ConfigMap
metadata:
  name: maesoongan-api-config
  namespace: app
data:
  SPRING_PROFILES_ACTIVE: prod
  APP_CORS_ALLOWED_ORIGINS: https://www.maesoongan.xyz,https://maesoongan.xyz
  JPA_DDL_AUTO: none
  JPA_SHOW_SQL: "false"
  JPA_FORMAT_SQL: "false"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  SPRING_DATA_REDIS_TIMEOUT: 3s
  REDIS_SSL_VERIFY_PEER: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka.internal.maesoongan.xyz:9092
  CONTEST_EVENT_TOPIC: contest.event
  CONTEST_PARTICIPATION_EVENT_TOPIC: contest.participation.event
  ACCOUNT_EVENT_TOPIC: account.event
  ORDER_REQUEST_TOPIC: order.request
  ORDER_CANCEL_TOPIC: order.cancel
  ORDER_CANCEL_RESULT_TOPIC: order.cancel.result
  TRADE_SYNC_KAFKA_ENABLED: "true"
  TRADE_SYNC_EXECUTION_CONFIRMED_TOPIC: execution.confirmed
  ORDER_REQUESTED_TOPIC: order-requested
  ORDER_CANCEL_REQUESTED_TOPIC: order-cancel-requested
  MEMBER_COMMAND_RESULT_TOPIC: member.command.result
  KAFKA_SEND_TIMEOUT: 3s
  # admin-service member.security.event consumer: 새 그룹+earliest로 과거 보안이벤트(비정상탐지/정지)까지 1회 백필.
  # handleEvent는 멱등이라 재생해도 중복 없음. (admin-service만 읽는 변수)
  ADMIN_KAFKA_GROUP_ID: admin-service-member-security-v2
  ADMIN_KAFKA_AUTO_OFFSET_RESET: earliest
  ORDER_CANCEL_PENDING_TTL: 30s
  ONPREM_MEMBER_SIGNUP_PATH: /api/members/signup
  ONPREM_MEMBER_LOGIN_PATH: /api/members/login/verify
  ONPREM_MEMBER_LOGIN_ID_FIND_PATH: /api/members/login-id/find
  ONPREM_MEMBER_PASSWORD_CHANGE_PATH: /api/members/password/change
  ONPREM_MEMBER_PASSWORD_RESET_PATH: /api/members/password/reset
  ONPREM_MEMBER_DELETE_PATH: /api/members/delete
  ONPREM_MEMBER_UPDATE_PATH: /api/members/update
  PORTFOLIO_INITIAL_CASH: "10000000"
  SPRING_MAIL_HOST: smtp.naver.com
  SPRING_MAIL_PORT: "465"
  SPRING_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_SMTP_STARTTLS_ENABLE: "false"
  SPRING_MAIL_SMTP_SSL_ENABLE: "true"
  KIS_BASE_URL: https://openapi.koreainvestment.com:9443
  KIS_TOKEN_URL: https://openapi.koreainvestment.com:9443/oauth2/tokenP
  KIS_ENVIRONMENT: real
  KIS_ACCOUNT_PRODUCT_CODE: "01"
  KIS_CUSTOMER_TYPE: P
  KIS_EXCHANGE_ID: KRX
  KIS_TOKEN_CACHE_TTL: 23h
  KIS_REQUEST_TIMEOUT: 5s
  KIS_DAILY_CHART_PATH: /uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice
  KIS_DAILY_CHART_TR_ID: FHKST03010100
  KIS_DAILY_CHART_MARKET_DIV_CODE: J
  KIS_DAILY_CHART_ADJUSTED_PRICE: "0"
  CHART_SYNC_ENABLED: "true"
  CHART_KIS_WINDOW_DAYS: "120"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
