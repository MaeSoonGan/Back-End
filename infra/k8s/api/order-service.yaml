apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: app
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        role: service
      containers:
        - name: order-service
          image: 295234319852.dkr.ecr.ap-northeast-2.amazonaws.com/maesoongan/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: ORDER_SERVICE_PORT
              value: "8084"
          envFrom:
            - configMapRef:
                name: maesoongan-api-config
            - secretRef:
                name: maesoongan-api-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: app
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
