apiVersion: v1
kind: Service
metadata:
  name: market-realtime-nlb
  namespace: app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: LoadBalancer
  selector:
    app: market-realtime-service     # 기존 시세 Pod 라벨
  ports:
    - port: 8087
      targetPort: 8087
      protocol: TCP