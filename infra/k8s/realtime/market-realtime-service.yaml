apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-realtime-service
  namespace: app
  annotations:
    configmap.reloader.stakater.com/reload: maesoongan-realtime-config
    secret.reloader.stakater.com/reload: market-realtime-service-secret
  labels:
    app: market-realtime-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: market-realtime-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8087"
      labels:
        app: market-realtime-service
    spec:
      nodeSelector:
        role: realtime
      containers:
        - name: market-realtime-service
          image: 295234319852.dkr.ecr.ap-northeast-2.amazonaws.com/maesoongan/market-realtime-service:cf402833237640209bc0c2354fe520e570e98f08
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          env:
            - name: REALTIME_QUOTE_INGESTOR_PORT
              value: "8087"
          envFrom:
            - configMapRef:
                name: maesoongan-realtime-config
            - secretRef:
                name: market-realtime-service-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: market-realtime-service
  namespace: app
  labels:
    app: market-realtime-service
spec:
  type: ClusterIP
  selector:
    app: market-realtime-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
