apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-realtime-internal
  namespace: app
  annotations:
    # 핵심: 내부 전용 ALB (VPC 사설 IP)
    alb.ingress.kubernetes.io/scheme: internal
    # Pod IP 직접 타겟 (기존과 동일)
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP만 (내부 통신, 인증서 불필요)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: "200"
    # 기존 internet-facing ALB와 다른 ALB로 생성되게 별도 그룹
    alb.ingress.kubernetes.io/group.name: internal-onprem
spec:
  ingressClassName: alb
  rules:
    - http:                          # host 조건 없음 — 사설 IP로 직접 접근
        paths:
          - path: /api/market/prices
            pathType: Prefix
            backend:
              service:
                name: market-realtime-service
                port:
                  number: 8087

          - path: /api/market/price
            pathType: Prefix
            backend:
              service:
                name: market-realtime-service
                port:
                  number: 8087
