apiVersion: v1
kind: ConfigMap
metadata:
  name: maesoongan-realtime-config
  namespace: app
data:
  SPRING_PROFILES_ACTIVE: prod
  QUOTE_SOURCE_MODE: kis
  QUOTE_INGESTION_AUTO_START: "true"
  QUOTE_INGESTION_STOCK_CODES: ""
  QUOTE_MOCK_EMIT_INTERVAL_MILLIS: "1000"
  STOCK_MASTER_LOAD_ENABLED: "false"
  STOCK_MASTER_FAIL_FAST: "false"
  REDIS_PORT: "6379"
  REDIS_TLS_ENABLED: "true"
  REDIS_SSL_VERIFY_PEER: "true"
  REDIS_ENABLED: "true"
  REDIS_QUOTE_TTL_SECONDS: "300"
  REDIS_MARKET_STATUS_TTL_SECONDS: "60"
  KAFKA_BOOTSTRAP_SERVERS: kafka.internal.maesoongan.xyz:9092
  KAFKA_TOPIC_PRICE: market.price
  KAFKA_TOPIC_ORDERBOOK: market.orderbook
  REALTIME_SSE_TIMEOUT_MS: "1800000"
  REALTIME_HEARTBEAT_INTERVAL_MS: "30000"
  KIS_BASE_URL: https://openapi.koreainvestment.com:9443
  KIS_TOKEN_URL: https://openapi.koreainvestment.com:9443/oauth2/tokenP
  KIS_ENVIRONMENT: real
  KIS_APPROVAL_URL: https://openapi.koreainvestment.com:9443/oauth2/Approval
  KIS_WEBSOCKET_URL: ws://ops.koreainvestment.com:21000
  KIS_PRICE_TR_ID: H0STCNT0
  KIS_ORDERBOOK_TR_ID: H0STASP0
  KIS_INDEX_TR_ID: H0UPCNT0
  KIS_HTS_TOP_VIEW_TR_ID: HHMCM000100C0
  KIS_HTS_TOP_VIEW_PATH: /uapi/domestic-stock/v1/ranking/hts-top-view
  KIS_HTS_TOP_VIEW_QUERY: "FID_COND_MRKT_DIV_CODE=J&FID_COND_SCR_DIV_CODE=20171&FID_INPUT_ISCD=0000&FID_DIV_CLS_CODE=0&FID_BLNG_CLS_CODE=0&FID_TRGT_CLS_CODE=111111111&FID_TRGT_EXLS_CLS_CODE=0000000000"
  KIS_CUSTOMER_TYPE: P
  KIS_EXCHANGE_ID: KRX
  RANKING_HTS_TOP_VIEW_ENABLED: "true"
  RANKING_HTS_TOP_VIEW_INITIAL_DELAY_MS: "1000"
  RANKING_HTS_TOP_VIEW_POLL_INTERVAL_MS: "10000"
  RANKING_HTS_TOP_VIEW_CACHE_TTL_SECONDS: "30"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
