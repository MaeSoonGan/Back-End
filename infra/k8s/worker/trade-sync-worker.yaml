apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-sync-worker
  namespace: app
  annotations:
    configmap.reloader.stakater.com/reload: maesoongan-api-config
    secret.reloader.stakater.com/reload: trade-sync-worker-secret
  labels:
    app: trade-sync-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: trade-sync-worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8088"
      labels:
        app: trade-sync-worker
    spec:
      nodeSelector:
        role: async
      containers:
        - name: trade-sync-worker
          image: 295234319852.dkr.ecr.ap-northeast-2.amazonaws.com/maesoongan/trade-sync-worker:40391f68faf580f5c1fb98281cc130d4da60fd37
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: TRADE_SYNC_WORKER_PORT
              value: "8088"
          envFrom:
            - configMapRef:
                name: maesoongan-api-config
            - secretRef:
                name: trade-sync-worker-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trade-sync-worker
  namespace: app
  labels:
    app: trade-sync-worker
spec:
  type: ClusterIP
  selector:
    app: trade-sync-worker
  ports:
    - name: http
      port: 8088
      targetPort: 8088
