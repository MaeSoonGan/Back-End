spring.application.name=maesoongan-market-realtime-service

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${REALTIME_QUOTE_INGESTOR_PORT:8087}

quote.source.mode=${QUOTE_SOURCE_MODE:mock}
quote.ingestion.auto-start=${QUOTE_INGESTION_AUTO_START:true}
quote.ingestion.stock-codes=${QUOTE_INGESTION_STOCK_CODES:}
quote.mock.emit-interval-millis=${QUOTE_MOCK_EMIT_INTERVAL_MILLIS:1000}

stock.master.load-enabled=${STOCK_MASTER_LOAD_ENABLED:false}
stock.master.kospi-path=${STOCK_MASTER_KOSPI_PATH:}
stock.master.kosdaq-path=${STOCK_MASTER_KOSDAQ_PATH:}
stock.master.fail-fast=${STOCK_MASTER_FAIL_FAST:false}

kis.app-key=${KIS_APP_KEY:}
kis.app-secret=${KIS_APP_SECRET:}
kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
kis.environment=${KIS_ENVIRONMENT:demo}
kis.approval-url=${KIS_APPROVAL_URL:http://210.107.75.78:9443/oauth2/Approval}
kis.websocket-url=${KIS_WEBSOCKET_URL:ws://210.107.75.79:21000}
kis.price-tr-id=${KIS_PRICE_TR_ID:H0STCNT0}
kis.orderbook-tr-id=${KIS_ORDERBOOK_TR_ID:H0STASP0}
kis.customer-type=${KIS_CUSTOMER_TYPE:P}
kis.exchange-id=${KIS_EXCHANGE_ID:KRX}

redis.host=${REDIS_HOST:}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.tls-enabled=${REDIS_TLS_ENABLED:${REDIS_TLS_ENABLE:false}}
redis.ssl-verify-peer=${REDIS_SSL_VERIFY_PEER:true}
redis.enabled=${REDIS_ENABLED:false}
redis.quote-ttl-seconds=${REDIS_QUOTE_TTL_SECONDS:300}
redis.market-status-ttl-seconds=${REDIS_MARKET_STATUS_TTL_SECONDS:60}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS_ENABLED:${REDIS_TLS_ENABLE:false}}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:3s}

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:}
kafka.topic.price=${KAFKA_TOPIC_PRICE:market.price}
kafka.topic.orderbook=${KAFKA_TOPIC_ORDERBOOK:market.orderbook}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${REDIS_ENABLED:false}
