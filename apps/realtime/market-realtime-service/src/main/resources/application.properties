spring.application.name=maesoongan-market-realtime-service

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${REALTIME_QUOTE_INGESTOR_PORT:8087}

quote.source.mode=${QUOTE_SOURCE_MODE:mock}
quote.ingestion.auto-start=${QUOTE_INGESTION_AUTO_START:true}
quote.ingestion.stock-codes=${QUOTE_INGESTION_STOCK_CODES:}
quote.mock.emit-interval-millis=${QUOTE_MOCK_EMIT_INTERVAL_MILLIS:1000}

stock.master.load-enabled=${STOCK_MASTER_LOAD_ENABLED:false}
stock.master.kospi-path=${STOCK_MASTER_KOSPI_PATH:}
stock.master.kosdaq-path=${STOCK_MASTER_KOSDAQ_PATH:}
stock.master.fail-fast=${STOCK_MASTER_FAIL_FAST:false}

kis.app-key=${KIS_APP_KEY:}
kis.app-secret=${KIS_APP_SECRET:}
kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
kis.token-url=${KIS_TOKEN_URL:}
kis.environment=${KIS_ENVIRONMENT:demo}
kis.approval-url=${KIS_APPROVAL_URL:https://openapivts.koreainvestment.com:29443/oauth2/Approval}
kis.websocket-url=${KIS_WEBSOCKET_URL:ws://ops.koreainvestment.com:31000}
kis.price-tr-id=${KIS_PRICE_TR_ID:H0STCNT0}
kis.orderbook-tr-id=${KIS_ORDERBOOK_TR_ID:H0STASP0}
kis.index-tr-id=${KIS_INDEX_TR_ID:H0UPCNT0}
kis.hts-top-view-tr-id=${KIS_HTS_TOP_VIEW_TR_ID:HHMCM000100C0}
kis.hts-top-view-path=${KIS_HTS_TOP_VIEW_PATH:/uapi/domestic-stock/v1/ranking/hts-top-view}
kis.hts-top-view-query=${KIS_HTS_TOP_VIEW_QUERY:FID_COND_MRKT_DIV_CODE=J&FID_COND_SCR_DIV_CODE=20171&FID_INPUT_ISCD=0000&FID_DIV_CLS_CODE=0&FID_BLNG_CLS_CODE=0&FID_TRGT_CLS_CODE=111111111&FID_TRGT_EXLS_CLS_CODE=0000000000}
kis.inquire-orderbook-tr-id=${KIS_INQUIRE_ORDERBOOK_TR_ID:FHKST01010200}
kis.inquire-orderbook-path=${KIS_INQUIRE_ORDERBOOK_PATH:/uapi/domestic-stock/v1/quotations/inquire-asking-price-exp-ccn}
kis.daily-chart-tr-id=${KIS_DAILY_CHART_TR_ID:FHKST03010100}
kis.daily-chart-path=${KIS_DAILY_CHART_PATH:/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice}
kis.daily-chart-market-div-code=${KIS_DAILY_CHART_MARKET_DIV_CODE:J}
kis.daily-chart-adjusted-price=${KIS_DAILY_CHART_ADJUSTED_PRICE:0}
kis.customer-type=${KIS_CUSTOMER_TYPE:P}
kis.exchange-id=${KIS_EXCHANGE_ID:KRX}

ranking.hts-top-view.enabled=${RANKING_HTS_TOP_VIEW_ENABLED:false}
ranking.hts-top-view.initial-delay-ms=${RANKING_HTS_TOP_VIEW_INITIAL_DELAY_MS:1000}
ranking.hts-top-view.poll-interval-ms=${RANKING_HTS_TOP_VIEW_POLL_INTERVAL_MS:10000}
ranking.hts-top-view.cache-ttl-seconds=${RANKING_HTS_TOP_VIEW_CACHE_TTL_SECONDS:30}

redis.host=${REDIS_HOST:}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.tls-enabled=${REDIS_TLS_ENABLED:${REDIS_TLS_ENABLE:false}}
redis.ssl-verify-peer=${REDIS_SSL_VERIFY_PEER:true}
redis.enabled=${REDIS_ENABLED:false}
redis.quote-ttl-seconds=${REDIS_QUOTE_TTL_SECONDS:300}
redis.market-status-ttl-seconds=${REDIS_MARKET_STATUS_TTL_SECONDS:60}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS_ENABLED:${REDIS_TLS_ENABLE:false}}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:3s}

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:}
kafka.topic.price=${KAFKA_TOPIC_PRICE:market.price}
kafka.topic.orderbook=${KAFKA_TOPIC_ORDERBOOK:market.orderbook}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.export.enabled=${MANAGEMENT_TRACING_EXPORT_ENABLED:true}
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:http}
management.health.redis.enabled=${REDIS_ENABLED:false}
