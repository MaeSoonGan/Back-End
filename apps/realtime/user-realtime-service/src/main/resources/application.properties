spring.application.name=maesoongan-user-realtime-service

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${USER_REALTIME_SERVICE_PORT:8087}

spring.mvc.async.request-timeout=-1

app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-me}
app.realtime.sse-timeout-ms=${REALTIME_SSE_TIMEOUT_MS:1800000}
app.realtime.heartbeat-interval-ms=${REALTIME_HEARTBEAT_INTERVAL_MS:30000}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
