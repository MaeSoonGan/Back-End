spring.application.name=maesoongan-auth-service

spring.profiles.include=secret
spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${AUTH_SERVICE_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/fisaschool?sslMode=trust&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_TLS_ENABLED:false}}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:3s}}
app.redis.ssl.verify-peer=${REDIS_SSL_VERIFY_PEER:true}

app.portfolio.initial-cash=${PORTFOLIO_INITIAL_CASH:1000000}

app.s3.bucket=${PROFILE_IMAGE_BUCKET:maesoongan-profile-images}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.presigned-url-expiry-seconds=${PROFILE_IMAGE_PRESIGNED_EXPIRY:300}

app.onprem.member-service.base-url=${ONPREM_MEMBER_SERVICE_BASE_URL:http://localhost:8083}
app.onprem.member-service.signup-path=${ONPREM_MEMBER_SIGNUP_PATH:/api/members/signup}
app.onprem.member-service.login-path=${ONPREM_MEMBER_LOGIN_PATH:/api/members/login/verify}
app.onprem.member-service.login-id-find-path=${ONPREM_MEMBER_LOGIN_ID_FIND_PATH:/api/members/login-id/find}
app.onprem.member-service.password-change-path=${ONPREM_MEMBER_PASSWORD_CHANGE_PATH:/api/members/password/change}
app.onprem.member-service.password-reset-path=${ONPREM_MEMBER_PASSWORD_RESET_PATH:/api/members/password/reset}
app.onprem.member-service.delete-path=${ONPREM_MEMBER_DELETE_PATH:/api/members/delete}
app.onprem.member-service.update-path=${ONPREM_MEMBER_UPDATE_PATH:/api/members/update}
app.onprem.member-service.auth-token=${ONPREM_SERVICE_AUTH_TOKEN:test-token}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.export.enabled=${MANAGEMENT_TRACING_EXPORT_ENABLED:true}
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:http}
