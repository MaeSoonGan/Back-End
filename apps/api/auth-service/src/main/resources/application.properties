spring.application.name=maesoongan-auth-service

spring.profiles.include=secret
spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${AUTH_SERVICE_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/fisaschool?sslMode=trust&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_TLS_ENABLED:false}}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:3s}}
app.redis.ssl.verify-peer=${REDIS_SSL_VERIFY_PEER:true}

app.portfolio.initial-cash=${PORTFOLIO_INITIAL_CASH:1000000}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
