spring.application.name=maesoongan-admin-service

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${ADMIN_SERVICE_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/fisaschool?sslMode=trust&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=${ADMIN_KAFKA_GROUP_ID:admin-service-member-security}
spring.kafka.consumer.auto-offset-reset=${ADMIN_KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.enabled=${ADMIN_KAFKA_ENABLED:true}
app.kafka.send-timeout=${ADMIN_KAFKA_SEND_TIMEOUT:5s}
app.kafka.topic.contest-event=${CONTEST_EVENT_TOPIC:contest.event}
app.kafka.topic.member-security-event=${MEMBER_SECURITY_EVENT_TOPIC:member.security.event}
app.kafka.topic.member-security-command=${MEMBER_SECURITY_COMMAND_TOPIC:member.security.command}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.export.enabled=${MANAGEMENT_TRACING_EXPORT_ENABLED:true}
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:http}
