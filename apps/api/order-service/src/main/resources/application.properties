spring.application.name=maesoongan-order-service

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${ORDER_SERVICE_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/fisaschool?sslMode=trust&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${ORDER_SERVICE_DB_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${ORDER_SERVICE_DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${ORDER_SERVICE_DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${ORDER_SERVICE_DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${ORDER_SERVICE_DB_MAX_LIFETIME_MS:120000}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:${REDIS_TLS_ENABLED:false}}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:${REDIS_TIMEOUT:3s}}
app.redis.ssl.verify-peer=${REDIS_SSL_VERIFY_PEER:true}

app.kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
app.kis.environment=${KIS_ENVIRONMENT:demo}
app.kis.app-key=${KIS_APP_KEY:}
app.kis.app-secret=${KIS_APP_SECRET:}
app.kis.account-number=${KIS_ACCOUNT_NUMBER:}
app.kis.account-product-code=${KIS_ACCOUNT_PRODUCT_CODE:01}
app.kis.customer-type=${KIS_CUSTOMER_TYPE:P}
app.kis.exchange-id=${KIS_EXCHANGE_ID:KRX}
app.kis.token-cache-ttl=${KIS_TOKEN_CACHE_TTL:23h}
app.kis.request-timeout=${KIS_REQUEST_TIMEOUT:5s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Kafka publishing can be disabled for local development without an on-prem Kafka connection.
app.kafka.enabled=${APP_KAFKA_ENABLED:true}
app.kafka.topic.order-request=${ORDER_REQUEST_TOPIC:${ORDER_REQUESTED_TOPIC:order.request}}
app.kafka.topic.order-cancel=${ORDER_CANCEL_TOPIC:${ORDER_CANCEL_REQUESTED_TOPIC:order.cancel}}
app.kafka.send-timeout=${KAFKA_SEND_TIMEOUT:3s}
app.order.cancel-pending-ttl=${ORDER_CANCEL_PENDING_TTL:30s}

app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-me}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.export.enabled=${MANAGEMENT_TRACING_EXPORT_ENABLED:true}
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:http}
