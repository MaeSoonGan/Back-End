spring.application.name=maesoongan-trade-sync-worker

spring.config.import=optional:file:./.env[.properties],optional:file:../../../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${TRADE_SYNC_WORKER_PORT:8088}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/fisaschool?sslMode=trust&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

app.kafka.enabled=${TRADE_SYNC_KAFKA_ENABLED:false}
app.kafka.topic.execution-confirmed=${TRADE_SYNC_EXECUTION_CONFIRMED_TOPIC:execution.confirmed}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${TRADE_SYNC_CONSUMER_GROUP:trade-sync-worker}
spring.kafka.consumer.auto-offset-reset=${TRADE_SYNC_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.observations.key-values.application=${spring.application.name}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
